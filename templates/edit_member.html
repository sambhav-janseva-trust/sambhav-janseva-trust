<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Member - Sambhav Janseva Trust</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 18px 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .title h2 {
            margin: 0;
        }

        .member-id {
            background: #e8f1fb;
            color: #1f4e79;
            padding: 9px 14px;
            border-radius: 7px;
            font-weight: bold;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            text-decoration: none;
            color: white;
            background: #2563eb;
            cursor: pointer;
            font-size: 15px;
        }

        .back {
            background: #6b7280;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .card {
                padding: 20px;
            }

            .title {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Sambhav Janseva Trust - Edit Member</h1>
    </header>

    <div class="container">

        <div class="card">

            <div class="title">
                <h2>Edit Member</h2>

                <div class="member-id">
                    {{ member.member_id }}
                </div>
            </div>

            <form method="POST">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Name *</label>
                        <input
                            type="text"
                            name="name"
                            value="{{ member.name }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Father / Husband Name</label>
                        <input
                            type="text"
                            name="father_name"
                            value="{{ member.father_name or '' }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>Mobile No *</label>
                        <input
                            type="text"
                            name="mobile"
                            value="{{ member.mobile }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input
                            type="email"
                            name="email"
                            value="{{ member.email or '' }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select name="gender">
                            <option value="">Select</option>
                            <option value="Male" {% if member.gender == "Male" %}selected{% endif %}>Male</option>
                            <option value="Female" {% if member.gender == "Female" %}selected{% endif %}>Female</option>
                            <option value="Other" {% if member.gender == "Other" %}selected{% endif %}>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input
                            type="date"
                            name="dob"
                            value="{{ member.dob or '' }}"
                        >
                    </div>

                    <div class="form-group full">
                        <label>Full Address></Address></label>
                        <textarea name="address">{{ member.address or '' }}</textarea>
                    </div>

                    <div class="form-group">
                        <label>Membership Type</label>
                        <input
                            type="text"
                            name="membership_type"
                            value="{{ member.membership_type or 'General' }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>Joining Date</label>
                        <input
                            type="date"
                            name="membership_date"
                            value="{{ member.membership_date or '' }}"
                        >
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select name="status">
                            <option value="Active" {% if member.status == "Active" %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if member.status == "Inactive" %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>

                </div>

                <div class="buttons">

                    <button type="submit" class="button">
                        Save Changes
                    </button>

                    <a href="/admin/members/{{ member.id }}" class="button back">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
