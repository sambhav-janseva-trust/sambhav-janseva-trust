<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Assistance Application - Sambhav Janseva Trust</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 18px 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            color: white;
            background: #2563eb;
            cursor: pointer;
            font-size: 15px;
        }

        .save {
            background: #15803d;
        }

        .back {
            background: #6b7280;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Sambhav Janseva Trust - Assistance Application</h1>
    </header>

    <div class="container">

        <div class="card">

            <h2>सहायता आवेदन जोड़ें</h2>

            <form method="POST">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Applicant Name *</label>
                        <input
                            type="text"
                            name="applicant_name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Father / Husband Name</label>
                        <input
                            type="text"
                            name="father_husband_name"
                        >
                    </div>

                    <div class="form-group">
                        <label>Mobile *</label>
                        <input
                            type="text"
                            name="mobile"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input
                            type="email"
                            name="email"
                        >
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select name="gender">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input
                            type="date"
                            name="date_of_birth"
                        >
                    </div>

                    <div class="form-group full">
                        <label>Address</label>
                        <textarea
                            name="address"
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label>Assistance Type</label>
                        <input
                            type="text"
                            name="assistance_type"
                            placeholder="जैसे Medical, Education, Food आदि"
                        >
                    </div>

                    <div class="form-group">
                        <label>Application Date</label>
                        <input
                            type="date"
                            name="application_date"
                        >
                    </div>

                    <div class="form-group full">
                        <label>Problem / Requirement</label>
                        <textarea
                            name="problem_requirement"
                            placeholder="आवेदक की समस्या या सहायता की आवश्यकता लिखें"
                        ></textarea>
                    </div>

                    <div class="form-group full">
                        <label>Remarks</label>
                        <textarea
                            name="remarks"
                            placeholder="अतिरिक्त जानकारी"
                        ></textarea>
                    </div>

                </div>

                <div class="buttons">

                    <button
                        type="submit"
                        class="button save"
                    >
                        Save Application
                    </button>

                    <a
                        href="/admin/dashboard"
                        class="button back"
                    >
                        ← Dashboard
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
