<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Assistance Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #222;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .field {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .application-id {
            background: #eee;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .save-btn {
            background: #198754;
            color: white;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 5px;
            display: inline-block;
        }

        @media (max-width: 700px) {
            .row {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Edit Assistance Application</h1>

        <form
            method="POST"
            action="{{ url_for(
                'edit_assistance',
                application_id=application.id
            ) }}"
        >

            <div class="row">

                <div class="field">

                    <label>Application ID</label>

                    <input
                        type="text"
                        value="{{ application.application_id }}"
                        class="application-id"
                        readonly
                    >

                </div>

                <div class="field">

                    <label>Application Date</label>

                    <input
                        type="date"
                        name="application_date"
                        value="{{ application.application_date or '' }}"
                    >

                </div>

            </div>


            <div class="row">

                <div class="field">

                    <label>Applicant Name</label>

                    <input
                        type="text"
                        name="applicant_name"
                        value="{{ application.applicant_name or '' }}"
                        required
                    >

                </div>

                <div class="field">

                    <label>Father / Husband Name</label>

                    <input
                        type="text"
                        name="father_husband_name"
                        value="{{ application.father_husband_name or '' }}"
                    >

                </div>

            </div>


            <div class="row">

                <div class="field">

                    <label>Mobile</label>

                    <input
                        type="text"
                        name="mobile"
                        value="{{ application.mobile or '' }}"
                        required
                    >

                </div>

                <div class="field">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ application.email or '' }}"
                    >

                </div>

            </div>


            <div class="row">

                <div class="field">

                    <label>Gender</label>

                    <select name="gender">

                        <option value="">
                            Select Gender
                        </option>

                        <option
                            value="Male"
                            {% if application.gender == "Male" %}
                            selected
                            {% endif %}
                        >
                            Male
                        </option>

                        <option
                            value="Female"
                            {% if application.gender == "Female" %}
                            selected
                            {% endif %}
                        >
                            Female
                        </option>

                        <option
                            value="Other"
                            {% if application.gender == "Other" %}
                            selected
                            {% endif %}
                        >
                            Other
                        </option>

                    </select>

                </div>

                <div class="field">

                    <label>Date of Birth</label>

                    <input
                        type="date"
                        name="date_of_birth"
                        value="{{ application.date_of_birth or '' }}"
                    >

                </div>

            </div>


            <div class="row">

                <div class="field">

                    <label>Assistance Type</label>

                    <input
                        type="text"
                        name="assistance_type"
                        value="{{ application.assistance_type or '' }}"
                    >

                </div>

            </div>


            <div class="row">

                <div class="field">

                    <label>Address</label>

                    <textarea
                        name="address"
                    >{{ application.address or '' }}</textarea>

                </div>

            </div>


            <div class="row">

                <div class="field">

                    <label>Problem / Requirement</label>

                    <textarea
                        name="problem_requirement"
                    >{{ application.problem_requirement or '' }}</textarea>

                </div>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Changes
                </button>

                <a
                    href="{{ url_for(
                        'view_assistance',
                        application_id=application.id
                    ) }}"
                    class="back-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
